<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Order - Record</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --border:#dfe3e8; --text:#1b2330;
    --muted:#6b7480; --accent:#2f6fed; --accent-weak:#e8f0fe;
    --red:#c62828; --red-weak:#fdecea; --green:#1b7f43; --green-weak:#e8f5ec;
    --amber:#9a6400; --amber-weak:#fff4e0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--text)}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--border);
        border-radius:12px;padding:18px;margin-bottom:16px}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--border);
        border-radius:8px;font-size:14px;background:#fff;color:var(--text)}
  .rec-row{display:flex;align-items:center;gap:14px;padding:10px 0}
  .rec-btn{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
        background:var(--red);color:#fff;font-size:22px;display:flex;
        align-items:center;justify-content:center;flex-shrink:0;
        box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .rec-btn.recording{animation:pulse 1.4s infinite}
  .rec-btn:disabled{opacity:.5;cursor:not-allowed;animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,40,40,.45)}
        70%{box-shadow:0 0 0 14px rgba(198,40,40,0)}
        100%{box-shadow:0 0 0 0 rgba(198,40,40,0)}}
  .rec-status{font-size:14px}
  .rec-time{font-family:ui-monospace,Consolas,monospace;color:var(--muted);
        font-size:13px}
  audio{width:100%;margin-top:12px}
  .btn{padding:10px 16px;border-radius:8px;border:1px solid var(--border);
        background:#fff;color:var(--text);font-size:14px;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .actions{display:flex;gap:10px;margin-top:14px}
  .banner{padding:10px 12px;border-radius:8px;font-size:13px;margin-top:14px;
        display:none}
  .banner.show{display:block}
  .banner.info{background:var(--accent-weak);color:var(--accent)}
  .banner.ok{background:var(--green-weak);color:var(--green)}
  .banner.err{background:var(--red-weak);color:var(--red)}
  .banner.warn{background:var(--amber-weak);color:var(--amber)}
  .status-steps{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .step{font-size:11px;padding:3px 8px;border-radius:999px;
        background:#eef1f5;color:var(--muted)}
  .step.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
  .step.done{background:var(--green-weak);color:var(--green)}
  .step.failed{background:var(--red-weak);color:var(--red)}
  .transcript{margin-top:12px;font-size:14px;line-height:1.5;
        background:#fafbfc;border:1px solid var(--border);border-radius:8px;
        padding:10px;white-space:pre-wrap}
  a.console-link{color:var(--accent);font-size:13px}
  .hint{color:var(--muted);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Record a voice order</h1>
  <p class="sub">Speak the scripted command (place order / return order /
    reorder), upload it, and watch it move through transcription and
    matching in real time.</p>

  <div class="card">
    <label for="phone">Phone number</label>
    <input type="text" id="phone" value="70000000">
    <p class="hint">Used only to identify the caller - the scripted
      command still names the customer explicitly.</p>
  </div>

  <div class="card">
    <div class="rec-row">
      <button class="rec-btn" id="recBtn" title="Record">&#9679;</button>
      <div>
        <div class="rec-status" id="recStatus">Ready to record</div>
        <div class="rec-time" id="recTime">00:00</div>
      </div>
    </div>
    <audio id="player" controls style="display:none"></audio>
    <div class="actions">
      <button class="btn" id="discardBtn" disabled>Discard</button>
      <button class="btn primary" id="uploadBtn" disabled>Upload</button>
    </div>
    <div class="banner" id="banner"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div><strong>Voice message #<span id="resVid"></span></strong></div>
    <div class="status-steps" id="steps"></div>
    <div class="transcript" id="transcriptBox" style="display:none"></div>
    <div class="hint" id="resHint" style="margin-top:10px"></div>
  </div>
</div>

<script>
const STEPS = ["received", "transcribing", "transcribed", "classified", "drafted"];
const TERMINAL_FAIL = ["failed", "too_long"];

let mediaRecorder = null;
let chunks = [];
let recordedBlob = null;
let startTs = 0;
let timerHandle = null;
let pollHandle = null;

const recBtn = document.getElementById("recBtn");
const recStatus = document.getElementById("recStatus");
const recTime = document.getElementById("recTime");
const player = document.getElementById("player");
const discardBtn = document.getElementById("discardBtn");
const uploadBtn = document.getElementById("uploadBtn");
const banner = document.getElementById("banner");

function showBanner(msg, cls) {
  banner.textContent = msg;
  banner.className = "banner show " + cls;
}
function hideBanner() {
  banner.className = "banner";
}

function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" +
         String(s % 60).padStart(2, "0");
}

async function startRecording() {
  hideBanner();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    showBanner("Microphone access denied or unavailable: " + e.message, "err");
    return;
  }
  chunks = [];
  const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
    ? "audio/webm;codecs=opus" : "";
  mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType })
                           : new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    recordedBlob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
    player.src = URL.createObjectURL(recordedBlob);
    player.style.display = "block";
    discardBtn.disabled = false;
    uploadBtn.disabled = false;
    recStatus.textContent = "Recorded - review, then upload";
  };
  mediaRecorder.start();
  startTs = Date.now();
  timerHandle = setInterval(() => { recTime.textContent = fmtTime(Date.now() - startTs); }, 200);
  recBtn.classList.add("recording");
  recBtn.innerHTML = "&#9632;";
  recStatus.textContent = "Recording...";
  player.style.display = "none";
  discardBtn.disabled = true;
  uploadBtn.disabled = true;
  document.getElementById("resultCard").style.display = "none";
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  clearInterval(timerHandle);
  recBtn.classList.remove("recording");
  recBtn.innerHTML = "&#9679;";
}

recBtn.addEventListener("click", () => {
  if (mediaRecorder && mediaRecorder.state === "recording") stopRecording();
  else startRecording();
});

discardBtn.addEventListener("click", () => {
  recordedBlob = null;
  player.style.display = "none";
  discardBtn.disabled = true;
  uploadBtn.disabled = true;
  recTime.textContent = "00:00";
  recStatus.textContent = "Ready to record";
  hideBanner();
});

uploadBtn.addEventListener("click", async () => {
  if (!recordedBlob) return;
  uploadBtn.disabled = true;
  discardBtn.disabled = true;
  recBtn.disabled = true;
  showBanner("Uploading...", "info");

  const phone = document.getElementById("phone").value.trim() || "70000000";
  const ext = (recordedBlob.type.includes("webm")) ? "webm"
            : (recordedBlob.type.includes("ogg")) ? "ogg" : "wav";
  const form = new FormData();
  form.append("phone", phone);
  form.append("audio", recordedBlob, "recording." + ext);

  try {
    const resp = await fetch("/ingest/voice", { method: "POST", body: form });
    if (!resp.ok) {
      const text = await resp.text();
      throw new Error(resp.status + ": " + text);
    }
    const data = await resp.json();
    showBanner("Uploaded - voice message #" + data.id, "ok");
    beginPolling(data.id);
  } catch (e) {
    showBanner("Upload failed: " + e.message, "err");
    uploadBtn.disabled = false;
    discardBtn.disabled = false;
  } finally {
    recBtn.disabled = false;
  }
});

function renderSteps(status) {
  const stepsEl = document.getElementById("steps");
  const failed = TERMINAL_FAIL.includes(status);
  const idx = STEPS.indexOf(status);
  stepsEl.innerHTML = STEPS.map((s, i) => {
    let cls = "step";
    if (failed && i === 0) cls += " done";
    else if (idx === -1) cls += "";
    else if (i < idx) cls += " done";
    else if (i === idx) cls += " active";
    return `<span class="${cls}">${s}</span>`;
  }).join("") + (failed ? `<span class="step failed">${status}</span>` : "");
}

function beginPolling(vid) {
  document.getElementById("resultCard").style.display = "block";
  document.getElementById("resVid").textContent = vid;
  document.getElementById("transcriptBox").style.display = "none";
  document.getElementById("resHint").textContent =
    "Waiting for the worker (python -m app.worker) to pick this up...";
  renderSteps("received");
  if (pollHandle) clearInterval(pollHandle);

  const poll = async () => {
    let data;
    try {
      const resp = await fetch("/ingest/voice/" + vid);
      data = await resp.json();
    } catch (e) {
      return; // transient - keep polling
    }
    renderSteps(data.status);
    if (data.transcript) {
      const box = document.getElementById("transcriptBox");
      box.style.display = "block";
      box.textContent = data.transcript +
        (data.language ? "  [" + data.language + "]" : "");
    }
    if (data.status === "drafted") {
      clearInterval(pollHandle);
      const hint = document.getElementById("resHint");
      if (data.request_id) {
        hint.innerHTML = 'Drafted as request #' + data.request_id +
          ' - <a class="console-link" href="/console" target="_blank">open the review console</a>';
      } else {
        hint.textContent = "Drafted (no review request was created).";
      }
    } else if (TERMINAL_FAIL.includes(data.status)) {
      clearInterval(pollHandle);
      document.getElementById("resHint").textContent =
        data.error ? ("Failed: " + data.error) : ("Status: " + data.status);
    }
  };
  poll();
  pollHandle = setInterval(poll, 1500);
}
</script>
</body>
</html>
